[project]
name = "pygubu-bootstack"
version = "0.1.0"
description = "bootstack support for pygubu"
readme = "README.md"
authors = [
    { name = "Alejandro Autalan", email = "alejandroautalan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bootstack>=0.1.0a9",
    "pygubu>=0.39",
]

[project.entry-points.'pygubu.plugins']
a = 'pygubu_bootstack'

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
